<!doctype html>
<!-- Installer artwork, rendered to BMP by crates/seokdok-tsf/installer/art/render.md.
     ?kind=side|mark  &theme=light|dark  &product=seokdok|eumdok  &w=…&h=… -->
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@500;700&display=block" />
<style>
  :root { --bg: #24348c; --ink: #ffffff; --soft: rgb(255 255 255 / 0.72); --wall: rgb(255 255 255 / 0.10); }
  :root[data-theme='dark'] { --bg: #0c1124; --ink: #9db0ff; --soft: rgb(190 200 240 / 0.7); --wall: rgb(157 176 255 / 0.08); }
  :root[data-product='eumdok'] { --bg: #7c2d23; }
  :root[data-product='eumdok'][data-theme='dark'] { --bg: #1d0e0b; --ink: #ffb8a3; --soft: rgb(240 205 195 / 0.7); --wall: rgb(255 184 163 / 0.08); }
  html, body { margin: 0; background: var(--bg); overflow: hidden; }
  .side { position: relative; width: 100vw; height: 100vh; color: var(--ink); font-family: 'Noto Serif KR', serif; }
  /* A faint wall of 訓讀 words behind, as on the site. */
  .wall { position: absolute; inset: -4% -10%; display: flex; flex-wrap: wrap; gap: 0.2em 0.5em; align-content: flex-start;
    font: 700 calc(100vw * 0.13) / 1.25 'Noto Serif KR', serif; color: var(--wall); transform: rotate(-8deg); }
  .title { position: absolute; left: 12%; top: 10%; writing-mode: vertical-rl; font: 900 calc(100vw * 0.5) / 1 'Noto Serif KR', serif; letter-spacing: -0.02em; }
  .club { position: absolute; right: 10%; top: 11%; writing-mode: vertical-rl; font: 700 calc(100vw * 0.085) / 1.2 'Noto Serif KR', serif; color: var(--soft); letter-spacing: 0.15em; }
  .foot { position: absolute; left: 12%; right: 10%; bottom: 7%; font: 700 calc(100vw * 0.075) / 1.3 'Noto Sans KR', sans-serif; color: var(--soft); letter-spacing: 0.08em; }
  .mark { width: 100vw; height: 100vh; display: grid; place-items: center; }
  .mark span { display: grid; place-items: center; width: 92%; height: 92%; border-radius: 22%; background: var(--bg-mark, var(--bg));
    color: #fff; font: 900 calc(100vw * 0.62) / 1 'Noto Serif KR', serif; }
  :root[data-kind='mark'] body { background: transparent; }
  :root[data-kind='mark'][data-theme='dark'] .mark span { background: #9db0ff; color: #0c1124; }
  :root[data-kind='mark'][data-product='eumdok'][data-theme='dark'] .mark span { background: #ffb8a3; color: #1d0e0b; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search)
  document.documentElement.dataset.theme = q.get('theme') || 'light'
  document.documentElement.dataset.kind = q.get('kind') || 'side'
  const eumdok = q.get('product') === 'eumdok'
  document.documentElement.dataset.product = eumdok ? 'eumdok' : 'seokdok'
  const seokdokWall = '在다 見다 讀다 天 書다 成다 知다 言하다 無다 好다 去다 來다 生다 作다 食다 新롭다 歡갑다 異다'.split(' ').concat('在다 見다 讀다 天 書다 成다 知다 言하다 無다 好다 去다 來다 生다 作다 食다 新롭다 歡갑다 異다'.split(' '), '在다 見다 讀다 天 書다 成다 知다 言하다 無다 好다 去다 來다'.split(' '))
  const eumdokWall = Array(4).fill('工夫 先生 學校 歷史 文字 言語 世上 事實 時間 人間 生活 問題 文章 自然').join(' ').split(' ')
  const words = eumdok ? eumdokWall : seokdokWall
  document.body.innerHTML = q.get('kind') === 'mark'
    ? `<div class="mark"><span>${eumdok ? '音' : '釋'}</span></div>`
    : `<div class="side">
         <div class="wall">${words.map(w => `<span>${w}</span>`).join('')}</div>
         <div class="title">${eumdok ? '音讀' : '釋讀'}</div>
         <div class="club">${eumdok ? '國漢文混用' : '釋讀會 御製'}</div>
         <div class="foot">${eumdok ? 'eumdok' : 'seokdok'}</div>
       </div>`
</script>
</body>
</html>
