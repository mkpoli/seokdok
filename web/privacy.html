<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>개인정보 처리방침 · Privacy policy | 釋讀 seokdok</title>
    <meta name="description" content="釋讀(석독) 입력기의 개인정보 처리방침. Privacy policy of the 釋讀 seokdok input method." />
    <link rel="canonical" href="https://seokdok.mkpo.li/privacy" />
    <meta name="theme-color" content="#24348c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const t = localStorage.getItem('seokdok:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/privacy.js"></script>
  </body>
</html>
