name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "crates/**"
      - "dict/**"
      - "products/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "crates/**"
      - "dict/**"
      - "products/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1

      # The release key lives in three repository secrets. Without them (and on
      # pull requests, which do not receive secrets from forks) the debug APK is built.
      - name: Check for the release key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$KEYSTORE" ] && [ "$EVENT" != pull_request ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the signed release APK
        if: steps.key.outputs.signed == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SEOKDOK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SEOKDOK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/seokdok.jks"
          export SEOKDOK_KEYSTORE="$RUNNER_TEMP/seokdok.jks"
          gradle assembleRelease --stacktrace
          rm -f "$SEOKDOK_KEYSTORE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/seokdok/release/app-seokdok-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/eumdok/release/app-eumdok-release.apk

      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.signed == 'true'
        with:
          name: seokdok-release-apk
          path: android/app/build/outputs/apk/seokdok/release/app-seokdok-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.signed == 'true'
        with:
          name: eumdok-release-apk
          path: android/app/build/outputs/apk/eumdok/release/app-eumdok-release.apk
          if-no-files-found: error

      - name: Build the debug APK
        if: steps.key.outputs.signed != 'true'
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.signed != 'true'
        with:
          name: seokdok-debug-apk
          path: android/app/build/outputs/apk/seokdok/debug/app-seokdok-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.signed != 'true'
        with:
          name: eumdok-debug-apk
          path: android/app/build/outputs/apk/eumdok/debug/app-eumdok-debug.apk
          if-no-files-found: error
