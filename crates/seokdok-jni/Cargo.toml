[package]
name = "seokdok-jni"
description = "釋讀 (seokdok) input method: JNI bindings for the Android keyboard"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "seokdok_jni"
crate-type = ["cdylib", "rlib"]

[features]
# Build 音讀 instead of 釋讀; see crates/seokdok-product.
eumdok = ["seokdok-ffi/eumdok", "seokdok-session/eumdok"]

[dependencies]
jni = { version = "0.21", default-features = false }
seokdok-ffi = { path = "../seokdok-ffi" }
seokdok-session = { path = "../seokdok-session" }
toml = "0.8"
