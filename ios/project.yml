# XcodeGen spec: `brew install xcodegen && cd ios && xcodegen` writes
# Seokdok.xcodeproj. Run ios/build-rust.sh first for SeokdokCore.xcframework.
# Set DEVELOPMENT_TEAM (Signing) before building for a device.
name: Seokdok
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The Rust library is built for arm64 simulators only.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    # A simulator runs ad-hoc signed code; a device build needs a team.
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
targets:
  Seokdok:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: li.mkpo.seokdok
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 釋讀
        UILaunchScreen: {}
        SeokdokAppGroup: group.li.mkpo.seokdok
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/Seokdok.entitlements
      properties:
        com.apple.security.application-groups: [group.li.mkpo.seokdok]
    dependencies:
      - target: SeokdokKeyboard
        embed: true
  SeokdokKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
      # Copied whole as dict/ (a folder reference); the keyboard loads it
      # from its bundle.
      - path: ../dict
        type: folder
        buildPhase: resources
    settings:
      base:
        # An extension's ID must extend its app's.
        PRODUCT_BUNDLE_IDENTIFIER: li.mkpo.seokdok.keyboard
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: 釋讀
        SeokdokAppGroup: group.li.mkpo.seokdok
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            PrimaryLanguage: ko-KR
            IsASCIICapable: false
            PrefersRightToLeft: false
            # Full Access lets the keyboard read the settings the app writes to
            # the shared container; the keyboard works without it.
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/SeokdokKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.li.mkpo.seokdok]
    dependencies:
      - framework: SeokdokCore.xcframework
        embed: false
  SeokdokUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: li.mkpo.seokdok.uitests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Seokdok
schemes:
  Seokdok:
    build:
      targets:
        Seokdok: all
    test:
      config: Debug
      targets: [SeokdokUITests]
