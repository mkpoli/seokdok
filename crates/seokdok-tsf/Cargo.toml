[package]
name = "seokdok-tsf"
description = "釋讀 (Seokdok) input method for Windows (Text Services Framework)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
name = "seokdok"
crate-type = ["cdylib", "rlib"]

[features]
# Build 音讀 instead of 釋讀; see crates/seokdok-product.
eumdok = ["seokdok-session/eumdok", "seokdok-product/eumdok"]

[dependencies]
seokdok-core = { path = "../seokdok-core" }
seokdok-session = { path = "../seokdok-session" }
seokdok-product = { path = "../seokdok-product" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-core = "0.60"

[target.'cfg(windows)'.dependencies.windows]
version = "0.60"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_TextServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_UI_Input_Ime",
    "Win32_Globalization",
]

[target.'cfg(windows)'.dev-dependencies]
png = "0.17"

[target.'cfg(windows)'.dev-dependencies.windows]
version = "0.60"
features = ["Win32_System_ProcessStatus", "Win32_System_Threading"]

[build-dependencies]
embed-resource = "3"
seokdok-product = { path = "../seokdok-product" }
