name: iOS

on:
  push:
    branches: [main, "ci/ios*"]
    paths: ["ios/**", "crates/**", "dict/**", "products/**", "Cargo.toml", "Cargo.lock", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "crates/**", "dict/**", "products/**", "Cargo.toml", "Cargo.lock", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios

      - name: Rust library (SeokdokCore.xcframework)
        run: ios/build-rust.sh

      - name: Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cd ios && xcodegen

      # Unsigned device build. The entitlements (the App Group) are attached
      # with an ad-hoc signature so that a sideloading tool, which re-signs
      # the app with the user's Apple ID, knows what to request.
      - name: Build for device
        working-directory: ios
        run: |
          xcodebuild -quiet build -project Seokdok.xcodeproj -scheme Seokdok \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          app=build/Build/Products/Release-iphoneos/Seokdok.app
          ./adhoc-sign.sh "$app"
          rm -rf Payload && mkdir Payload && cp -R "$app" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Seokdok-unsigned.ipa
          ls -l Seokdok-unsigned.ipa
          du -sh "$app" "$app/PlugIns"/*.appex

      - uses: actions/upload-artifact@v4
        with:
          name: Seokdok-unsigned-ipa
          path: ios/Seokdok-unsigned.ipa
          if-no-files-found: error

      # On the simulator, drive the real keyboard extension with a UI test,
      # then measure it.
      - name: Boot a simulator with only the 釋讀 keyboard
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | test("^iPhone 16( Pro)?$"))][0].udid')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl spawn "$udid" defaults write .GlobalPreferences AppleKeyboards -array li.mkpo.seokdok.keyboard
          xcrun simctl spawn "$udid" defaults write .GlobalPreferences AppleKeyboardsExpanded -int 1

      - name: UI test
        working-directory: ios
        run: |
          mkdir -p shots
          # A recording shows what stills cannot: pop-ups, the drawer's motion.
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force shots/ui-test.mp4 &
          recorder=$!
          status=0
          TEST_RUNNER_SHOTS="$PWD/shots" xcodebuild -quiet test -project Seokdok.xcodeproj -scheme Seokdok \
            -destination "id=$UDID" -derivedDataPath build -resultBundlePath ui-test.xcresult || status=$?
          kill -INT "$recorder" || true
          wait "$recorder" || true
          if [ "$status" != 0 ]; then
            xcrun xcresulttool get test-results tests --path ui-test.xcresult | tee shots/failures.json | jq -r '.. | .failureMessage? // empty' || true
            xcrun xcresulttool get test-results summary --path ui-test.xcresult | jq -r '.testFailures[]? | "\(.testName): \(.failureText)"' || true
          fi
          exit "$status"

      - name: Memory of the keyboard extension
        if: always()
        continue-on-error: true
        working-directory: ios
        run: |
          # A fresh boot: the test runner's libraries would count otherwise.
          xcrun simctl shutdown "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl launch "$UDID" li.mkpo.seokdok -focusTrial YES
          sleep 15
          pid=$(pgrep -x SeokdokKeyboard)
          footprint "$pid" | tee shots/footprint.txt
          vmmap --summary "$pid" | tee shots/vmmap.txt | awk '/Physical footprint/'

      - name: Dark mode screenshot
        if: always()
        continue-on-error: true
        working-directory: ios
        run: |
          xcrun simctl ui "$UDID" appearance dark
          sleep 3
          xcrun simctl io "$UDID" screenshot shots/keyboard-dark.png
          xcrun simctl terminate "$UDID" li.mkpo.seokdok
          xcrun simctl launch "$UDID" li.mkpo.seokdok -focusTrial YES -trialKind number
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/number-pad-dark.png
          xcrun simctl terminate "$UDID" li.mkpo.seokdok
          # XCUIDevice.appearance does not reach the simulator's look, so the
          # tests that shoot screens run again under this one.
          mkdir -p shots/dark
          TEST_RUNNER_SHOTS="$PWD/shots/dark" xcodebuild -quiet test -project Seokdok.xcodeproj -scheme Seokdok \
            -destination "id=$UDID" -derivedDataPath build \
            -only-testing:SeokdokUITests/KeyboardUITests/testDarkScreens \
            -only-testing:SeokdokUITests/KeyboardUITests/testSettingsScreens

      # App Store rule 4.4.1: the keyboard must remain functional without
      # Full Access. Rebuild the extension with the key off and run the same
      # test.
      - name: UI test with Full Access off
        working-directory: ios
        run: |
          xcrun simctl ui "$UDID" appearance light
          plutil -replace NSExtension.NSExtensionAttributes.RequestsOpenAccess -bool NO Keyboard/Info.plist
          mkdir -p shots/no-full-access
          TEST_RUNNER_SHOTS="$PWD/shots/no-full-access" xcodebuild -quiet test -project Seokdok.xcodeproj -scheme Seokdok \
            -destination "id=$UDID" -derivedDataPath build
          flag=$(plutil -extract NSExtension.NSExtensionAttributes.RequestsOpenAccess raw \
            build/Build/Products/Debug-iphonesimulator/Seokdok.app/PlugIns/SeokdokKeyboard.appex/Info.plist)
          echo "RequestsOpenAccess in the tested extension: $flag"
          test "$flag" = false

      # The simulator shows the system's globe, so force the keyboard's own
      # for one test, then fail on any Auto Layout conflict the extension
      # logged during the run.
      - name: UI test with the keyboard's own globe key
        if: always()
        working-directory: ios
        run: |
          xcrun simctl spawn "$UDID" defaults write li.mkpo.seokdok.keyboard forceGlobe -bool YES
          mkdir -p shots/globe
          TEST_RUNNER_SHOTS="$PWD/shots/globe" xcodebuild -quiet test -project Seokdok.xcodeproj -scheme Seokdok \
            -destination "id=$UDID" -derivedDataPath build \
            -only-testing:SeokdokUITests/KeyboardUITests/testNumberPadWithGlobeKey
          xcrun simctl spawn "$UDID" defaults delete li.mkpo.seokdok.keyboard forceGlobe

      - name: Auto Layout conflicts in the keyboard
        if: always()
        working-directory: ios
        run: |
          xcrun simctl spawn "$UDID" log show --style compact --last 90m \
            --predicate 'process == "SeokdokKeyboard" AND eventMessage CONTAINS "Unable to simultaneously satisfy constraints"' | tee shots/constraints.txt
          if grep -q "Unable to simultaneously" shots/constraints.txt; then exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: ios/shots/
          if-no-files-found: ignore

  eumdok:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-eumdok

      - name: Rust library (SeokdokCore.xcframework)
        run: ios/build-rust.sh eumdok

      - name: Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          ios/product.sh eumdok

      - name: Build for device
        working-directory: ios
        run: |
          xcodebuild -quiet build -project Seokdok.xcodeproj -scheme Seokdok \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          app=build/Build/Products/Release-iphoneos/Seokdok.app
          ./adhoc-sign.sh "$app"
          rm -rf Payload && mkdir Payload && cp -R "$app" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Eumdok-unsigned.ipa
          ls -l Eumdok-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Eumdok-unsigned-ipa
          path: ios/Eumdok-unsigned.ipa
          if-no-files-found: error
