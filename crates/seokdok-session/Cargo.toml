[package]
name = "seokdok-session"
description = "Platform-independent input-method core for 釋讀: key session, engine host, settings"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
# Build 音讀 instead of 釋讀; see crates/seokdok-product.
eumdok = ["seokdok-product/eumdok"]

[dependencies]
seokdok-core = { path = "../seokdok-core" }
seokdok-product = { path = "../seokdok-product" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
