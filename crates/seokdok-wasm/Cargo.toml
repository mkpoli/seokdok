[package]
name = "seokdok-wasm"
description = "WebAssembly bindings for the 釋讀 conversion engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
seokdok-core = { path = "../seokdok-core" }
seokdok-session = { path = "../seokdok-session" }
wasm-bindgen = "0.2"
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
