[package]
name = "seokdok-ffi"
description = "釋讀 (seokdok) input method: C interface to the session, for the fcitx5 addon, the iOS keyboard, the macOS input method and the Windows settings app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
name = "seokdok_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Build 音讀 instead of 釋讀; see crates/seokdok-product.
eumdok = ["seokdok-session/eumdok", "seokdok-product/eumdok"]

[dependencies]
seokdok-core = { path = "../seokdok-core" }
seokdok-session = { path = "../seokdok-session" }
seokdok-product = { path = "../seokdok-product" }
serde_json = "1"
