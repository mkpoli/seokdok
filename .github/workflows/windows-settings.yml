name: Windows settings app

# Builds the WinUI settings app. web/scripts/release.sh and
# crates/seokdok-tsf/package.sh take the artifact of the latest push to main.
on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "crates/seokdok-core/**"
      - "crates/seokdok-session/**"
      - "crates/seokdok-ffi/**"
      - "Cargo.lock"
      - ".github/workflows/windows-settings.yml"
  pull_request:
    paths:
      - "windows/**"
      - "crates/seokdok-core/**"
      - "crates/seokdok-session/**"
      - "crates/seokdok-ffi/**"
      - "Cargo.lock"
      - ".github/workflows/windows-settings.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-settings

      - name: Build
        shell: pwsh
        run: windows\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: seokdok-settings-app
          path: target/settings-app/
          if-no-files-found: error
