<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>지원 · Support | 釋讀 seokdok</title>
    <meta name="description" content="釋讀(석독) 입력기의 사용법과 문의. Help, common problems and contact for the 釋讀 seokdok input method." />
    <link rel="canonical" href="https://seokdok.mkpo.li/support" />
    <meta name="theme-color" content="#24348c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;600;700&family=Noto+Serif+KR:wght@500;700;900&display=swap"
    />
    <script>
      try {
        const t = localStorage.getItem('seokdok:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/support.js"></script>
  </body>
</html>
